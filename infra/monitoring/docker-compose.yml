# Monitoring auf app-nbg1. Erreichbar nur über das interne Netz bzw. per SSH-Tunnel.
services:
  prometheus:
    image: prom/prometheus:v3.5.0
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus:/prometheus
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=90d"]
    ports: ["127.0.0.1:9090:9090"]
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:v0.28.1
    volumes:
      - ./alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager:/alertmanager
    ports: ["127.0.0.1:9093:9093"]
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.1.1
    environment:
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes: [grafana:/var/lib/grafana]
    secrets: [grafana_admin]
    ports: ["127.0.0.1:3001:3000"]
    restart: unless-stopped

  uptime-kuma:
    image: louislam/uptime-kuma:1.23.16
    volumes: [kuma:/app/data]
    ports: ["127.0.0.1:3002:3001"]
    restart: unless-stopped

secrets:
  grafana_admin:
    file: /etc/idf/grafana_admin

volumes:
  prometheus:
  alertmanager:
  grafana:
  kuma:
