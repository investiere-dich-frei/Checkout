global:
  scrape_interval: 30s

rule_files: [/etc/prometheus/alerts.yml]

scrape_configs:
  - job_name: node
    static_configs:
      - targets: ["10.20.1.10:9100", "10.20.1.20:9100", "10.20.1.21:9100"]
  - job_name: postgres
    static_configs:
      - targets: ["10.20.1.20:9187", "10.20.1.21:9187"]
