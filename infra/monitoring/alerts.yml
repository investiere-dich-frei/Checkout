groups:
  - name: idf-checkout
    rules:
      - alert: ServerNichtErreichbar
        expr: up == 0
        for: 3m
      - alert: WalArchivierungHaengt
        # Archivierung schlägt fehl oder steht länger als 10 Minuten: RPO in Gefahr.
        expr: increase(pg_stat_archiver_failed_count[10m]) > 0 or pg_stat_archiver_last_archive_age > 600
        for: 5m
      - alert: ReplikatHinkt
        expr: pg_replication_lag_seconds > 300
        for: 5m
      - alert: PlatteFastVoll
        expr: (node_filesystem_avail_bytes{fstype=~"ext4|xfs"} / node_filesystem_size_bytes) < 0.15
        for: 10m
