# Öffentliche IPv4-Adressen aus `terraform output` (angelegt am 29.10.2026).
# Ansible läuft vom Mac mini aus, der nicht im privaten Hetzner-Netz hängt;
# die privaten Adressen (10.20.1.x) stehen als private_ip für die Dienste untereinander.
all:
  vars:
    ansible_user: root
    ansible_ssh_private_key_file: ~/.ssh/idf_server
  children:
    app:
      hosts:
        app-nbg1: { ansible_host: 2.31.89.112, private_ip: 10.20.1.10 }
    db:
      hosts:
        db-nbg1: { ansible_host: 2.31.93.148, private_ip: 10.20.1.20, pg_role: primary }
        db-fsn1: { ansible_host: 178.105.16.150, private_ip: 10.20.1.21, pg_role: replica }
    bot:
      hosts:
        bot-nbg1: { ansible_host: 91.98.174.199 }
