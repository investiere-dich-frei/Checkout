- name: PostgreSQL-Paketquelle (PGDG)
  ansible.builtin.deb822_repository:
    name: pgdg
    types: [deb]
    uris: https://apt.postgresql.org/pub/repos/apt
    suites: ["{{ ansible_distribution_release }}-pgdg"]
    components: [main]
    signed_by: https://www.postgresql.org/media/keys/ACCC4CF8.asc

- name: PostgreSQL 17 und pgBackRest
  ansible.builtin.apt:
    name: [postgresql-17, pgbackrest]
    update_cache: true

- name: WAL-Archivierung
  ansible.builtin.copy:
    src: ../../../backup/postgresql-archive.conf
    dest: /etc/postgresql/17/main/conf.d/archive.conf
    mode: "0644"
  when: pg_role == "primary"

# Streaming-Replikation nach FSN1 wird in Phase 0, Schritt "Replikat", ergänzt.
