# Anwendungsdatenbank "idf". Sie gehört der Rolle idf_migrator, die nur die Migrationen
# aus packages/db einspielt. Kein Superuser: Laut ADR 0001 arbeitet nichts außer der
# Wartung als Superuser, weil der die GoBD-Trigger umgehen könnte.
# Die spätere Anwendungsrolle bekommt nur Rechte, ist aber nie Eigentümerin der Tabellen.
# Nur auf dem Primary; das Replikat erhält Datenbank und Schema über die Replikation.

- name: Rolle für Migrationen
  community.postgresql.postgresql_user:
    name: idf_migrator
    password: "{{ pg_migrator_password }}"
    role_attr_flags: LOGIN,NOSUPERUSER,NOCREATEDB,NOCREATEROLE
  become_user: postgres
  no_log: true
  when: pg_role == "primary"

- name: Datenbank idf
  community.postgresql.postgresql_db:
    name: idf
    owner: idf_migrator
    encoding: UTF8
    lc_collate: C.UTF-8
    lc_ctype: C.UTF-8
    template: template0
  become_user: postgres
  when: pg_role == "primary"

# Anwendungsrolle: darf lesen und schreiben, aber nichts löschen und ist nie Eigentümerin
# (Rechte setzt packages/db/grants.sql). Zugang nur vom App-Server über das private Netz.
- name: Rolle für die Anwendung
  community.postgresql.postgresql_user:
    name: idf_app
    password: "{{ pg_app_password }}"
    role_attr_flags: LOGIN,NOSUPERUSER,NOCREATEDB,NOCREATEROLE,NOINHERIT
  become_user: postgres
  no_log: true
  when: pg_role == "primary" and pg_app_password is defined

- name: Zugang der Anwendung vom App-Server
  ansible.builtin.lineinfile:
    path: /etc/postgresql/17/main/pg_hba.conf
    line: "hostssl idf idf_app {{ hostvars[groups['app'][0]].private_ip }}/32 scram-sha-256"
  when: pg_role == "primary" and pg_app_password is defined
  register: pg_app_hba

- name: Zugang neu laden
  ansible.builtin.service:
    name: postgresql@17-main
    state: reloaded
  when: pg_role == "primary" and pg_app_hba.changed
