# Grundeinrichtung der Kasse (App und Datenbanken). Aufruf:
#   ansible-playbook -i inventories/prod site.yml
# Der Bot-Server bot-nbg1 hat ein eigenes Playbook (bot.yml) und wird hier ausgelassen.
- name: Basis für alle Server
  hosts: all:!bot
  become: true
  roles: [base]

- name: Datenbank und Sicherung
  hosts: db
  become: true
  roles: [postgres, backup]

# Nach der Datenbank, weil der PostgreSQL-Exporter eine Datenbankrolle braucht.
- name: Messfühler für die Überwachung
  hosts: all:!bot
  become: true
  roles: [exporter]

- name: Überwachung und Alarme
  hosts: app
  become: true
  roles: [monitoring]

- name: Checkout-Anwendung
  hosts: app
  become: true
  roles:
    - role: app
      when: checkout_ready | bool

# Zum Schluss, damit alle Dienste schon laufen, wenn die Firewall zugeht.
- name: Firewall
  hosts: all:!bot
  become: true
  roles: [firewall]
